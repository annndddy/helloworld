version: 2
snapshot:
  # Instructs Percy to wait a brief moment for lazy-loaded assets to render
  network-idle-timeout: 250
discovery:
  allowed-hostnames:
    - "*.vercel.app"
    - "render.percy.local"
  # This syntax resolves the 404 error by passing the bypass token to all asset requests
  request-headers:
    x-vercel-protection-bypass: "${VERCEL_AUTOMATION_BYPASS_SECRET}"
